name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  release-check:
    name: release-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Includes the golden-spec replay against evals/baseline.scripted.json: a regression fails here.
      - run: uv run pytest -q
      - run: uv run python -m factory.cli evals run --model replay --backend local --out evals/runs/ci.json
      - run: uv run python -m factory.cli evals compare evals/baseline.scripted.json evals/runs/ci.json
