[project]
name = "agent-factory"
version = "0.0.1"
description = "Agent Factory 2: spec-to-code factory on Gemini + LangChain family"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph==1.2.15",
  "langgraph-checkpoint-postgres==3.1.3",
  "langchain-core==1.6.10",
  "langchain-google-genai==4.4.2",
  "langsmith==0.14.8",
  "pydantic>=2,<3",
  "fastapi",
  "uvicorn",
  "psycopg[binary]",
  "pyyaml",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["factory"]
