[project]
name = "agent-factory"
version = "0.0.1"
description = "Agent Factory 2: Gemini + LangChain-family spec-to-code factory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph==1.2.15",
  "langgraph-checkpoint-postgres==3.1.3",
  "langchain-core==1.6.10",
  "langchain-google-genai==4.4.2",
  "langsmith==0.14.8",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["factory"]
